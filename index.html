<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAME BREAKER — Guess the Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0e;
    --panel: #17151c;
    --panel-2: #1f1c25;
    --gold: #e8b34d;
    --velvet: #a8394a;
    --cream: #f2ede2;
    --cream-dim: #cfc8b8;
    --teal: #3a8f86;
    --tile: #232028;
    --tile-edge: #322d38;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #201a22 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: 'Archivo', system-ui, sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 60px;
  }

  .marquee{
    text-align:center;
    margin-bottom: 6px;
  }
  .marquee h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    letter-spacing: 0.06em;
    margin: 0;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(232,179,77,0.35), 0 2px 0 #6b4a1a;
  }
  .marquee p{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 4px 0 0;
  }
  .marquee .bulbs{
    display:flex; justify-content:center; gap:6px; margin: 10px 0 22px;
  }
  .marquee .bulbs span{
    width:6px; height:6px; border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 6px 2px rgba(232,179,77,0.6);
    animation: flicker 1.8s infinite ease-in-out;
  }
  .marquee .bulbs span:nth-child(odd){ animation-delay: .3s; }
  @keyframes flicker{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .stage{
    width: 100%;
    max-width: 620px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid #2c2731;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7);
  }

  .deckbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--cream-dim);
    letter-spacing: 0.08em;
  }
  .deckbar button{
    background: transparent;
    border: 1px solid #3a3441;
    color: var(--cream-dim);
    padding: 6px 10px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.72rem;
    cursor:pointer;
    transition: border-color .15s, color .15s;
  }
  .deckbar button:hover{ border-color: var(--gold); color: var(--gold); }

  /* film strip frame with sprocket holes */
  .filmframe{
    display:flex;
    align-items:stretch;
    gap:0;
    border-radius: 10px;
    overflow:hidden;
    background:#000;
  }
  .sprockets{
    width: 16px;
    background: repeating-linear-gradient(
      to bottom,
      #000 0px, #000 10px,
      transparent 10px, transparent 20px
    );
    display:flex;
    flex-direction:column;
    justify-content: space-evenly;
    padding: 8px 0;
  }
  .sprockets div{
    width: 8px; height: 8px; margin: 0 auto;
    background: var(--bg);
    border-radius: 2px;
  }

  .image-wrap{
    position:relative;
    flex:1;
    aspect-ratio: 4 / 3;
    background:#000;
    overflow:hidden;
  }
  .image-wrap img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .tilegrid{
    position:absolute; inset:0;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }
  .tile{
    position:relative;
    background: var(--tile);
    border: 1px solid var(--tile-edge);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .45s ease, background .3s;
    font-family:'IBM Plex Mono', monospace;
    color: #6b6474;
    font-size: 1rem;
    user-select:none;
  }
  .tile:hover:not(.broken){ background:#2b2733; color: var(--gold); }
  .tile.broken{
    opacity:0;
    transform: scale(1.15) rotate(4deg);
    pointer-events:none;
  }
  .image-wrap.shake{
    animation: shake .4s ease-in-out;
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-4px); }
    40%{ transform: translateX(4px); }
    60%{ transform: translateX(-3px); }
    80%{ transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce){
    .image-wrap.shake{ animation: none; }
  }

  .soundBtn{
    background: transparent;
    border: 1px solid #3a3441;
    color: var(--cream-dim);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .15s, color .15s;
  }
  .soundBtn:hover{ border-color: var(--gold); color: var(--gold); }

  .status-row{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 16px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--cream-dim);
  }
  .lives{
    display:flex; gap:6px;
  }
  .lives .sq{
    width: 16px; height:16px; border-radius:3px;
    border: 1.5px solid var(--gold);
  }
  .lives .sq.used{ background: var(--velvet); border-color: var(--velvet); }
  .lives .sq.left{ background: transparent; }

  form.guessform{
    display:flex; gap:8px; margin-top: 14px;
  }
  form.guessform input[type=text]{
    flex:1;
    background: #0f0d12;
    border: 1px solid #3a3441;
    color: var(--cream);
    padding: 12px 14px;
    border-radius: 8px;
    font-family:'Archivo', sans-serif;
    font-size: 0.95rem;
    outline:none;
  }
  form.guessform input[type=text]:focus{ border-color: var(--gold); }
  form.guessform button{
    background: var(--gold);
    color: #241a06;
    border:none;
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.04em;
    font-size: 1.05rem;
    padding: 0 22px;
    border-radius: 8px;
    cursor:pointer;
    transition: filter .15s, transform .1s;
  }
  form.guessform button:hover{ filter: brightness(1.08); }
  form.guessform button:active{ transform: translateY(1px); }
  form.guessform button:disabled{ opacity:.4; cursor:not-allowed; }

  .message{
    margin-top: 14px;
    min-height: 26px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    text-align:center;
    letter-spacing: 0.02em;
  }
  .message.win{ color: var(--teal); }
  .message.lose{ color: var(--velvet); }
  .message.wrong{ color: var(--velvet); font-weight: 600; }

  .endpanel{
    margin-top: 16px;
    text-align:center;
    display:none;
  }
  .endpanel.show{ display:block; }
  .endpanel .film-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 0.03em;
    margin: 4px 0;
  }
  .endpanel button{
    margin-top: 10px;
    background: var(--teal);
    color: #071916;
    border:none;
    font-family:'Bebas Neue', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    padding: 10px 24px;
    border-radius: 8px;
    cursor:pointer;
  }

  details.builder{
    margin-top: 22px;
    width: 100%;
    max-width: 620px;
    background: var(--panel);
    border: 1px solid #2c2731;
    border-radius: 12px;
    padding: 14px 18px;
  }
  details.builder summary{
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--cream-dim);
    text-transform: uppercase;
  }
  .builder-body{ margin-top: 14px; display:flex; flex-direction:column; gap:10px; }
  .builder-body label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--cream-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .builder-body input[type=text]{
    background:#0f0d12; border:1px solid #3a3441; color:var(--cream);
    padding: 10px 12px; border-radius: 8px; font-family:'Archivo',sans-serif; font-size:0.9rem;
  }
  .builder-body input[type=file]{
    color: var(--cream-dim); font-family:'IBM Plex Mono', monospace; font-size:0.75rem;
  }
  .builder-body button{
    align-self:flex-start;
    background: var(--gold); color:#241a06; border:none;
    font-family:'Bebas Neue', sans-serif; font-size:0.95rem; letter-spacing:0.04em;
    padding: 9px 18px; border-radius:8px; cursor:pointer;
  }
  .builder-note{
    font-size: 0.72rem; color: #857d90; line-height:1.5;
  }

  footer{
    margin-top: 26px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: #5c5666;
    text-align:center;
    max-width: 500px;
    line-height:1.6;
  }

  .results-page{
    display:none; min-height:60vh; padding:32px 16px 48px;
    align-items:center; justify-content:center;
  }
  .results-page.show{display:flex;}
  .results-card{
    width:min(680px,100%); background:linear-gradient(180deg,#17131b,#0f0d12);
    border:1px solid #3a3441; border-radius:18px; padding:34px 28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.35); position:relative; overflow:hidden;
  }
  .results-card:before{content:""; position:absolute; inset:0 auto auto 0; width:100%; height:4px; background:var(--gold);}
  .results-kicker,.results-label{font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.14em; color:var(--cream-dim); text-transform:uppercase;}
  .results-card h2{font-family:'Bebas Neue',sans-serif; font-size:3.4rem; line-height:1; margin:7px 0 12px; color:var(--gold); letter-spacing:.05em;}
  .results-summary{font-size:1.12rem; line-height:1.55; color:var(--cream); max-width:570px;}
  .results-divider{height:1px; background:#302a34; margin:24px 0 18px;}
  .results-list{display:grid; gap:9px; margin-top:10px;}
  .result-row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:18px; padding:14px 16px; border:1px solid #302a34; border-radius:10px; background:#121016;}
  .result-row.complete{border-color:rgba(58,196,164,.45);}
  .result-row.failed{border-color:#e04b55; box-shadow:0 0 0 2px rgba(224,75,85,.22), 0 0 18px rgba(224,75,85,.12);}
  .result-row.failed .result-level{color:#e04b55;}
  .result-level{font-family:'Bebas Neue',sans-serif; font-size:1.25rem; letter-spacing:.05em;}
  .result-film{font-size:.78rem; color:var(--cream-dim); margin-top:2px;}
  .result-moves{font-family:'IBM Plex Mono',monospace; font-size:.8rem; text-align:right; color:var(--teal);}
  .result-moves strong{font-size:1.05rem; color:var(--cream);}
  .results-footer{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:22px;}
  #resultsScore{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--cream-dim);}
  #shareResultsBtn{background:var(--teal); color:#071916; border:none; font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:.05em; padding:11px 18px; border-radius:8px; cursor:pointer;}
  .share-note{min-height:18px; text-align:right; margin-top:9px; font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--cream-dim);}
  @media(max-width:560px){.results-card{padding:28px 18px}.results-card h2{font-size:2.8rem}.results-footer{align-items:stretch; flex-direction:column}.share-note{text-align:left}}
</style>
</head>
<body>

  <div class="marquee">
    <h1>FRAME BREAKER</h1>
    <p>break the squares · guess the film</p>
    <div class="bulbs">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="stage">
    <div class="deckbar">
      <span id="deckLabel">LEVEL 1 OF 5</span>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="soundBtn" id="soundBtn" type="button" title="Toggle sound" aria-label="Toggle sound">🔊</button>
        <!-- Daily challenge: skipping levels is intentionally disabled. -->
      </div>
    </div>

    <div class="filmframe">
      <div class="sprockets"></div>
      <div class="image-wrap">
        <img id="frameImg" src="" alt="Mystery movie frame">
        <div class="tilegrid" id="tileGrid"></div>
      </div>
      <div class="sprockets"></div>
    </div>

    <div class="status-row">
      <span id="guessesLabel" style="font-weight:600;">10 moves left</span>
      <div class="lives" id="livesRow"></div>
    </div>

    <form class="guessform" id="guessForm">
      <input type="text" id="guessInput" placeholder="Type the film title…" autocomplete="off">
      <button type="submit" id="guessBtn">Guess</button>
    </form>

    <div class="message" id="message"></div>

    <div class="endpanel" id="endPanel">
      <div id="endHeading">THE ANSWER WAS</div>
      <div class="film-title" id="revealTitle"></div>
      <button id="nextBtn" type="button">Next level →</button>
    </div>
  </div>

  <section class="results-page" id="resultsPage" aria-hidden="true">
    <div class="results-card">
      <div class="results-kicker">FRAME BREAKER · DAILY RESULTS</div>
      <h2 id="resultsTitle">RESULTS</h2>
      <div class="results-summary" id="resultsSummary"></div>
      <div class="results-divider"></div>
      <div class="results-label">YOUR RUN</div>
      <div class="results-list" id="resultsList"></div>
      <div class="results-footer">
        <span id="resultsScore"></span>
        <button type="button" id="shareResultsBtn">Share results</button>
      </div>
      <div class="share-note" id="shareNote"></div>
    </div>
  </section>

  <footer>
    Breaking a tile or guessing wrong spends one of your 10 total moves. Correct guesses are free. Complete all 5 levels to master today's challenge.
  </footer>

<script>
(function(){
  // ---- sound engine: everything synthesized, no audio files needed ----
  let audioCtx = null;
  let muted = false;

  function ctx(){
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        audioCtx = new AC();
      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }catch(err){
      return null;
    }
  }

  function tone(freq, startTime, duration, opts){
    try{
      opts = opts || {};
      const c = ctx();
      if(!c) return;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, startTime);
      if(opts.slideTo) osc.frequency.exponentialRampToValueAtTime(opts.slideTo, startTime + duration);
      const vol = opts.vol != null ? opts.vol : 0.18;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(vol, startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain).connect(c.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }catch(err){ /* never let audio break gameplay */ }
  }

  function noiseBurst(startTime, duration, filterFreq, vol){
    try{
      const c = ctx();
      if(!c) return;
      const bufferSize = Math.floor(c.sampleRate * duration);
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
      const src = c.createBufferSource();
      src.buffer = buffer;
      const filt = c.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = filterFreq || 1800;
      const gain = c.createGain();
      gain.gain.setValueAtTime(vol || 0.25, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      src.connect(filt).connect(gain).connect(c.destination);
      src.start(startTime);
    }catch(err){ /* never let audio break gameplay */ }
  }

  function sfxBreak(){
    if(muted) return;
    const c = ctx();
    if(!c) return;
    noiseBurst(c.currentTime, 0.12, 2200, 0.22);
  }
  function sfxWrong(){
    if(muted) return;
    const c = ctx();
    if(!c) return;
    tone(220, c.currentTime, 0.16, { type:'sawtooth', slideTo: 110, vol: 0.16 });
  }
  function sfxWin(){
    if(muted) return;
    const c = ctx();
    if(!c) return;
    const t = c.currentTime;
    tone(523.25, t, 0.16, { type:'triangle', vol:0.2 });
    tone(659.25, t+0.14, 0.16, { type:'triangle', vol:0.2 });
    tone(783.99, t+0.28, 0.32, { type:'triangle', vol:0.22 });
  }
  function sfxLose(){
    if(muted) return;
    const c = ctx();
    if(!c) return;
    const t = c.currentTime;
    tone(300, t, 0.22, { type:'sawtooth', slideTo: 220, vol:0.18 });
    tone(220, t+0.2, 0.22, { type:'sawtooth', slideTo: 140, vol:0.18 });
    tone(140, t+0.4, 0.4, { type:'sawtooth', slideTo: 80, vol:0.2 });
  }

  // ============================================================
  // MANUAL PUZZLE DATA — EDIT THIS SECTION
  // Add your movie frames, titles, and alternative answers here.
  // IMPORTANT: add exactly 5 movie objects — one for each level.
  // ============================================================
  let deck = [
    {
      title: "Cars",
      alts: [],
      img: "frames/cars.png"

    },
    {
      title: "Saving Private Ryan",
      alts: [],
      img: "frames/saving_private_ryan.png"

    },
    {
      title: "Fantastic Mr Fox",
      alts: [],
      img: "frames/fantastic_mr_fox.png"

    },
    {
      title: "Jaws",
      alts: [],
      img: "frames/jaws.png"
    },
    {
      title: "Pulp Piction",
      alts: [],
      img: "frames/pulp_fiction.png"
    }

  ];
  // ---- daily 5-level game state ----
  // One movie per level. Each movie is revealed through its 3x3 tile grid.
  // The player has ONE shared pool of 10 moves across all five levels.
  const TOTAL_LEVELS = 5;
  const MAX_MOVES = 10;
  const STORAGE_KEY = 'frame-breaker-daily-v2';

  let currentIndex = 0;
  let broken = new Set();
  let movesUsed = 0;
  let over = false;
  let dailyFinished = false;
  let completedLevels = [];
  let levelMoves = Array(TOTAL_LEVELS).fill(0);
  let levelStartMovesRemaining = Array(TOTAL_LEVELS).fill(null);

  const frameImg = document.getElementById('frameImg');
  const tileGrid = document.getElementById('tileGrid');
  const guessForm = document.getElementById('guessForm');
  const guessInput = document.getElementById('guessInput');
  const guessBtn = document.getElementById('guessBtn');
  const messageEl = document.getElementById('message');
  const guessesLabel = document.getElementById('guessesLabel');
  const livesRow = document.getElementById('livesRow');
  const endPanel = document.getElementById('endPanel');
  const endHeading = document.getElementById('endHeading');
  const revealTitle = document.getElementById('revealTitle');
  const nextBtn = document.getElementById('nextBtn');
  const deckLabel = document.getElementById('deckLabel');
  const soundBtn = document.getElementById('soundBtn');
  const resultsPage = document.getElementById('resultsPage');
  const resultsSummary = document.getElementById('resultsSummary');
  const resultsList = document.getElementById('resultsList');
  const resultsScore = document.getElementById('resultsScore');
  const shareResultsBtn = document.getElementById('shareResultsBtn');
  const shareNote = document.getElementById('shareNote');

  soundBtn.addEventListener('click', function(){
    muted = !muted;
    soundBtn.textContent = muted ? '🔇' : '🔊';
    if(!muted) ctx();
  });

  function normalize(s){
    return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  }

  function todayKey(){
    // Use the player's local browser date, like Wordle.
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  function currentPuzzle(){ return deck[currentIndex]; }

  function movesLeft(){
    return MAX_MOVES - movesUsed;
  }

  function saveGame(){
    const state = {
      date: todayKey(),
      currentIndex,
      movesUsed,
      broken: Array.from(broken),
      over,
      dailyFinished,
      completedLevels,
      levelMoves,
      levelStartMovesRemaining
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadSavedGame(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const state = JSON.parse(raw);
      if(!state || state.date !== todayKey()) return null;
      return state;
    }catch(err){
      return null;
    }
  }

  function buildTiles(){
    tileGrid.innerHTML = '';
    for(let i=0;i<9;i++){
      const t = document.createElement('div');
      t.className = 'tile';
      t.dataset.index = i;
      t.textContent = i+1;
      t.addEventListener('click', () => breakTile(i));
      tileGrid.appendChild(t);
    }

    broken.forEach(i => {
      const tileEl = tileGrid.querySelector('[data-index="'+i+'"]');
      if(tileEl) tileEl.classList.add('broken');
    });
  }

  function renderStatus(){
    livesRow.innerHTML = '';
    for(let i=0;i<MAX_MOVES;i++){
      const sq = document.createElement('div');
      sq.className = 'sq ' + (i < movesUsed ? 'used' : 'left');
      livesRow.appendChild(sq);
    }

    guessesLabel.textContent = movesLeft() + (movesLeft() === 1 ? ' move left' : ' moves left');
    guessesLabel.style.color = movesUsed > 0 ? 'var(--velvet)' : 'var(--cream-dim)';

    deckLabel.textContent = 'LEVEL ' + (currentIndex + 1) + ' OF ' + TOTAL_LEVELS;
  }

  function spendMove(){
    if(over || movesUsed >= MAX_MOVES) return false;

    movesUsed++;
    levelMoves[currentIndex] = (levelMoves[currentIndex] || 0) + 1;
    renderStatus();
    saveGame();

    if(movesUsed >= MAX_MOVES){
      endGame(false);
    }
    return true;
  }

  function breakTile(i){
    if(over || broken.has(i) || movesUsed >= MAX_MOVES) return;

    broken.add(i);
    const tileEl = tileGrid.querySelector('[data-index="'+i+'"]');
    if(tileEl) tileEl.classList.add('broken');

    sfxBreak();
    spendMove();
  }

  function shakeCard(){
    const wrap = document.querySelector('.image-wrap');
    wrap.classList.add('shake');
    setTimeout(() => wrap.classList.remove('shake'), 400);
  }

  function setMessage(text, cls){
    messageEl.textContent = text;
    messageEl.className = 'message' + (cls ? ' '+cls : '');
  }

  function showCurrentAnswer(){
    document.querySelectorAll('.tile').forEach(t => t.classList.add('broken'));
    revealTitle.textContent = currentPuzzle().title;
  }

  function endGame(won){
    over = true;
    guessInput.disabled = true;
    guessBtn.disabled = true;
    showCurrentAnswer();

    if(won){
      completedLevels = Array.from(new Set([...completedLevels, currentIndex + 1])).sort((a,b)=>a-b);

      if(currentIndex === TOTAL_LEVELS - 1){
        dailyFinished = true;
        endHeading.textContent = 'ALL 5 LEVELS COMPLETE';
        revealTitle.textContent = currentPuzzle().title;
        nextBtn.textContent = 'Results';
        nextBtn.disabled = false;
        setMessage(
          'You mastered all 5 levels with ' + movesLeft() +
          ' ' + (movesLeft() === 1 ? 'move' : 'moves') + ' remaining!',
          'win'
        );
      } else {
        endHeading.textContent = 'LEVEL ' + (currentIndex + 1) + ' COMPLETE';
        revealTitle.textContent = currentPuzzle().title;
        nextBtn.textContent = 'Next level →';
        nextBtn.disabled = false;
        setMessage(
          'Level complete! ' + movesLeft() +
          ' ' + (movesLeft() === 1 ? 'move' : 'moves') + ' remaining.',
          'win'
        );
      }
      sfxWin();
      endPanel.classList.add('show');
      saveGame();

      return;
    }

    dailyFinished = true;
    endHeading.textContent = 'GAME OVER';
    nextBtn.textContent = 'Results';
    nextBtn.disabled = false;

    setMessage(
      'You reached Level ' + (currentIndex + 1) +
      ' with 0 moves remaining.',
      'lose'
    );
    sfxLose();
    endPanel.classList.add('show');
    saveGame();
  }

  guessForm.addEventListener('submit', function(e){
    e.preventDefault();
    if(over) return;

    const raw = guessInput.value;
    if(!raw.trim()) return;

    const guessNorm = normalize(raw);
    const answers = [currentPuzzle().title, ...(currentPuzzle().alts||[])].map(normalize);
    const correct = answers.includes(guessNorm);

    if(correct){
      endGame(true);
      return;
    }

    shakeCard();
    sfxWrong();
    guessInput.value = '';
    guessInput.focus();

    const stillGoing = spendMove();
    if(stillGoing && !over){
      const left = movesLeft();
      setMessage(
        'Not quite — ' + left + ' ' + (left === 1 ? 'move' : 'moves') + ' left.',
        'wrong'
      );
    }
  });

  function loadPuzzle(index, restoredState){
    currentIndex = Math.max(0, Math.min(index, Math.min(deck.length, TOTAL_LEVELS) - 1));
    const p = currentPuzzle();

    if(restoredState){
      broken = new Set(restoredState.broken || []);
      movesUsed = Number(restoredState.movesUsed) || 0;
      over = !!restoredState.over;
      dailyFinished = !!restoredState.dailyFinished;
      completedLevels = Array.isArray(restoredState.completedLevels) ? restoredState.completedLevels : [];
      levelMoves = Array.isArray(restoredState.levelMoves) ? restoredState.levelMoves : Array(TOTAL_LEVELS).fill(0);
      levelMoves = Array.from({length: TOTAL_LEVELS}, (_, i) => Number(levelMoves[i]) || 0);
      levelStartMovesRemaining = Array.isArray(restoredState.levelStartMovesRemaining) ? restoredState.levelStartMovesRemaining : Array(TOTAL_LEVELS).fill(null);
      levelStartMovesRemaining = Array.from({length: TOTAL_LEVELS}, (_, i) => levelStartMovesRemaining[i] == null ? null : Number(levelStartMovesRemaining[i]));
    } else {
      // Starting/advancing to a puzzle must not erase the move history
      // from levels the player has already completed. The shared 10-move
      // counter continues, while levelMoves keeps the per-level breakdown.
      broken = new Set();
      over = false;
      dailyFinished = false;
      completedLevels = Array.isArray(completedLevels) ? completedLevels : [];
      if(!Array.isArray(levelMoves) || levelMoves.length !== TOTAL_LEVELS){
        levelMoves = Array(TOTAL_LEVELS).fill(0);
      }
      if(!Array.isArray(levelStartMovesRemaining) || levelStartMovesRemaining.length !== TOTAL_LEVELS){
        levelStartMovesRemaining = Array(TOTAL_LEVELS).fill(null);
      }
      if(levelStartMovesRemaining[0] == null) levelStartMovesRemaining[0] = MAX_MOVES;
    }

    frameImg.src = p.img;
    buildTiles();
    renderStatus();
    setMessage('', '');
    endPanel.classList.remove('show');
    guessInput.disabled = over || dailyFinished;
    guessBtn.disabled = over || dailyFinished;
    guessInput.value = '';

    nextBtn.disabled = false;
    nextBtn.textContent = currentIndex === TOTAL_LEVELS - 1 ? 'Finish' : 'Next level →';

    if(over){
      endPanel.classList.add('show');
      showCurrentAnswer();

      if(dailyFinished && currentIndex === TOTAL_LEVELS - 1 && completedLevels.includes(TOTAL_LEVELS)){
        endHeading.textContent = 'ALL 5 LEVELS COMPLETE';
        nextBtn.textContent = 'Results';
        nextBtn.disabled = false;
        setMessage(
          'You mastered all 5 levels with ' + movesLeft() +
          ' ' + (movesLeft() === 1 ? 'move' : 'moves') + ' remaining!',
          'win'
        );
      } else if(dailyFinished){
        endHeading.textContent = 'GAME OVER';
        nextBtn.textContent = 'Results';
        nextBtn.disabled = false;
        setMessage(
          'You reached Level ' + (currentIndex + 1) + ' with ' +
          movesLeft() + ' moves remaining.',
          'lose'
        );
      } else if(completedLevels.includes(currentIndex + 1)){
        endHeading.textContent = 'LEVEL ' + (currentIndex + 1) + ' COMPLETE';
        nextBtn.textContent = currentIndex === TOTAL_LEVELS - 1 ? 'Finish' : 'Next level →';
      }
    }
  }

  function showResults(){
    const completedCount = completedLevels.length;
    const failedLevel = dailyFinished && !completedLevels.includes(currentIndex + 1) ? currentIndex + 1 : null;

    if(completedCount === TOTAL_LEVELS){
      resultsSummary.textContent = 'ALL 5 LEVELS COMPLETED';
    } else if(failedLevel){
      resultsSummary.textContent = completedCount + ' LEVEL' + (completedCount === 1 ? '' : 'S') + ' COMPLETED';
    } else {
      resultsSummary.textContent = completedCount + ' LEVEL' + (completedCount === 1 ? '' : 'S') + ' COMPLETED';
    }

    resultsList.innerHTML = '';
    for(let i = 0; i < TOTAL_LEVELS; i++){
      const row = document.createElement('div');
      const isComplete = completedLevels.includes(i + 1);
      const isFailed = failedLevel === i + 1;
      const isReached = i + 1 <= currentIndex + 1;
      row.className = 'result-row' + (isComplete ? ' complete' : '') + (isFailed ? ' failed' : '');
      const moves = levelMoves[i] || 0;
      const p = deck[i];
      const status = isComplete ? 'COMPLETED' : isFailed ? 'FAILED' : isReached ? 'REACHED' : 'NOT REACHED';
      row.innerHTML = '<div><div class="result-level">LEVEL ' + (i + 1) + ' — ' + status + '</div><div class="result-film">' + (p ? p.title : '') + '</div></div>' +
        '<div class="result-moves"><strong>' + moves + '</strong><br>' + (moves === 1 ? 'MOVE' : 'MOVES') + '</div>';
      resultsList.appendChild(row);
    }
    resultsScore.textContent = movesUsed + ' / ' + MAX_MOVES + ' MOVES USED';
    shareNote.textContent = '';
    document.querySelector('.stage').style.display = 'none';
    document.querySelector('footer').style.display = 'none';
    resultsPage.classList.add('show');
    resultsPage.setAttribute('aria-hidden','false');
    try{ history.replaceState(null, '', '#results'); }catch(e){}
    window.scrollTo({top:0, behavior:'smooth'});
  }

  shareResultsBtn.addEventListener('click', async function(){
    const lines = ['FRAME BREAKER — DAILY RESULTS', resultsSummary.textContent, ''];
    for(let i=0;i<TOTAL_LEVELS;i++) lines.push('LEVEL ' + (i+1) + ' — ' + (levelMoves[i] || 0) + ' ' + ((levelMoves[i] || 0) === 1 ? 'move' : 'moves'));
    const text = lines.join('\n');
    try{
      await navigator.clipboard.writeText(text);
      shareNote.textContent = 'RESULTS COPIED — SHARE THEM WITH YOUR FRIENDS';
    }catch(e){
      shareNote.textContent = text;
    }
  });

  nextBtn.addEventListener('click', function(){
    if(nextBtn.disabled) return;

    if(dailyFinished){
      showResults();
      return;
    }

    if(currentIndex >= TOTAL_LEVELS - 1){
      dailyFinished = true;
      over = true;
      saveGame();
      showResults();
      return;
    }

    levelStartMovesRemaining[currentIndex + 1] = movesLeft();
    loadPuzzle(currentIndex + 1);
    saveGame();
  });

  // A skipped puzzle would bypass the shared-move challenge, so there is
  // deliberately no skip action in the 5-level daily version.

  // ---- initialize today's challenge ----
  const saved = loadSavedGame();

  if(deck.length < TOTAL_LEVELS){
    deckLabel.textContent = 'ADD 5 MOVIES TO THE DECK';
    setMessage(
      'This daily challenge needs 5 movie entries in the MANUAL PUZZLE DATA section.',
      'wrong'
    );
    guessInput.disabled = true;
    guessBtn.disabled = true;
    nextBtn.disabled = true;
  } else if(saved){
    loadPuzzle(saved.currentIndex, saved);
  } else {
    loadPuzzle(0);
    saveGame();
  }

})();
</script>
</body>
</html>
